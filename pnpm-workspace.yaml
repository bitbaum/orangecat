# Workspace packages. package.json "workspaces" is an npm field pnpm ignores,
# so the list lives here. packages/sdk is published on its own and is
# deliberately NOT a workspace member (its consumers install it from npm).
packages:
  - 'packages/collective-kinds'
  - 'packages/tax-model'

allowBuilds:
  # Ours (bitbaum/listkit), GitHub-hosted with no committed dist: its `prepare`
  # builds it on install, which pnpm only runs for packages named here. Keep
  # the URL in step with the commit package.json pins.
  listkit@https://codeload.github.com/bitbaum/listkit/tar.gz/c519d389b99d22f74bf9c092a603fe27061857cc: true
  '@parcel/watcher': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security/dedupe pins. These lived in package.json "overrides", which pnpm
# silently IGNORES (npm-only field) — they must live here to keep applying.
overrides:
  '@isaacs/brace-expansion': ^5.0.1
  # npm's override said `$sharp` (follow the direct dep); pnpm 11 deprecates
  # that reference syntax, so the range is spelled out — keep in sync with the
  # sharp entry in package.json optionalDependencies.
  # 0.35.5 closes the librsvg advisory (GHSA-wq5f-xc86-pv6w, high), 2026-10.
  sharp: ^0.35.5
  # 1.31.0 stops the OAuth client sending credentials to an authorization
  # server the MCP server picks (GHSA-6qxp-vccf-f47h, high), 2026-10. Pinned
  # here as well as in package.json so a transitive copy cannot stay behind.
  '@modelcontextprotocol/sdk@1': ^1.31.0
  '@babel/core': ^7.29.6
  # 4.13.7: hono/jsx left plain strings unescaped in boundary components (2026-10).
  hono: ^4.13.7
  js-yaml: ^4.3.2
  # qs: first_patched_version, bounded to its major (2026-09-25).
  qs@6: ^6.16.0
  # >=5.0.11 closes both brace-expansion DoS advisories (uncontrolled recursion,
  # 2026-09-30); bounded to its major like qs.
  brace-expansion@5: ^5.0.11
  tar: ^7.5.8
  postcss: ^8.5.10
  uuid: ^14.0.0
  # 1.11.0: quote() command injection via a line terminator (critical, 2026-10).
  shell-quote@1: ^1.11.0
  # Transitive-only advisories, published 2026-10 (pnpm audit --prod blocks on
  # them). First patched version, bounded to its major like qs.
  # proxy-addr: IPv4-mapped IP spoofing (critical), via @modelcontextprotocol/sdk > express.
  proxy-addr@2: ^2.0.8
  # source-map-js: event-loop DoS (high), via postcss.
  source-map-js@1: ^1.2.2
  # Dependabot alerts open on 2026-10-08, each at its first patched version and
  # bounded to the major the tree already uses (an unbounded `>=` once shipped a
  # surprise major). Dependabot cannot open these itself: they are transitive.
  undici@7: ^7.29.1 # TLS certificate validation bypass (high) + 5 lower, dev-only via jsdom
  brace-expansion@1: ^1.1.21 # quadratic expansion of `{a},b}` (the @5 pin above does not reach major 1)
  fast-uri@3: ^3.1.8 # inconsistent host case normalization
  ip-address@10: ^10.7.1 # isInSubnet/link-local/NAT64 misclassification, parse-diagnostic DoS
  joi@18: ^18.2.9 # prototype replacement through message compilation
  postcss-selector-parser@7: ^7.1.6 # quadratic selector parsing
  # katex: prototype-pollution trust bypass (low). mermaid — even 12.x — still
  # declares ^0.16, so this lifts it one minor past what mermaid asks for.
  # renderToString, the one call mermaid and bip-kit make, is unchanged across
  # 0.16→0.18; __tests__/unit/lib/katex-renders.test.ts pins that.
  katex@0: ^0.18.2

# pnpm refuses packages published within its minimum-release-age window — a
# supply-chain guard against a compromised release being installed before
# anyone notices. @bitbaum/ai-kit 0.6.2 is our own package, published to npm
# the day before this commit, so it needs an explicit exemption.
#
# Temporary: once 0.6.2 is older than the window this entry is redundant and
# should be deleted. Add lines only for versions we published ourselves —
# never to hurry along a third-party package.
minimumReleaseAgeExclude:
  - '@bitbaum/ai-kit'
  - '@bitbaum/mail-kit'
  - 'limitkit'
  # Ours, and recent enough to still be inside the window. Its absence failed
  # BOTH CI jobs at `pnpm install --frozen-lockfile`, before a line of code ran
  # — which surfaces as a bare "exit code 1" with no annotation, so it reads
  # like a broken build rather than a refused dependency. vitareba needed the
  # same entry when it adopted this package.
  - 'threadkit'
  # Ours (bitbaum/bip-kit); each release is inside the window when adopted.
  - 'bip-kit'
