name: Migration Replay

# Applies supabase/migrations/* to a FRESH database from zero, in order, via the
# Supabase CLI. The box's DB is only ever migrated forward incrementally and the
# restore drill restores *data* (a dump), so the from-scratch schema build is
# otherwise never exercised — a migration that can't build on an empty DB (bad
# ordering, missing prerequisite, non-idempotent replay) would only surface when
# provisioning a new box during a disaster. This job turns that into a PR-time
# check, and doubles as the missing pre-prod gate for migration changes.
#
# Deliberately a SEPARATE workflow, not a job in CI: CD deploys on the `CI`
# workflow_run succeeding, and we don't want a from-scratch DB spin-up (heavier,
# and new) sitting in that critical path. This is advisory-but-visible on the PR.
#
# Runs when migrations / config / this workflow change (so it self-tests on the PR
# that introduces it) and on demand.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/migration-replay.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/migration-replay.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: migration-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Apply all migrations from an empty DB
        # `supabase start` boots a fresh local stack and applies supabase/migrations/*
        # in filename order as part of DB init. A migration error fails startup and
        # this step exits non-zero — that IS the gate. Keep kong + storage-api up so
        # the post-migration storage/health step also passes (a clean exit 0 means
        # the schema built AND the stack came up); exclude the rest for speed.
        run: |
          # The `avatars` bucket seeds from ./avatars (not in the repo) and rejects
          # non-image files — irrelevant to a migration check, so drop the seed path
          # for this run (ephemeral edit to the CI checkout only).
          sed -i 's|^objects_path = "./avatars"|# objects_path (skipped in migration-replay)|' supabase/config.toml
          supabase start -x realtime,imgproxy,edge-runtime,studio,logflare,vector,supavisor,mailpit,postgres-meta

      - name: Confirm the schema actually materialized
        run: |
          # After the baseline squash the CLI records only 2 migrations, so count the
          # built SCHEMA instead: the baseline creates 100+ public tables from scratch.
          TABLES=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -tAc \
            "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE';")
          echo "Built $TABLES public tables from an empty database."
          if [ "${TABLES:-0}" -lt 100 ]; then
            echo "::error::Expected the baseline to build 100+ tables from scratch; got $TABLES."
            exit 1
          fi

      # Deleting an account goes through GoTrue, which deletes as
      # supabase_auth_admin, and every trigger the cascade reaches runs as that
      # role unless it is SECURITY DEFINER. A superuser DELETE cannot catch a
      # trigger that role may not run: 20261112120000 shipped one, and every
      # account in an identity circle answered 500 on deletion until
      # 20261112230000. So delete a holder and its identity the way production
      # does, through GoTrue's admin API.
      - name: An account in an identity circle can be deleted through GoTrue
        run: |
          eval "$(supabase status -o env)"
          # Older CLIs print SERVICE_ROLE_KEY, newer ones SECRET_KEY.
          SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          if [ -z "${API_URL:-}" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::supabase status gave no API_URL or service key"
            exit 1
          fi
          DB="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          create() {
            curl -sf -X POST "$API_URL/auth/v1/admin/users" \
              -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"$1\",\"password\":\"replay-$RANDOM-$RANDOM-aA9!\",\"email_confirm\":true}" \
              | jq -r .id
          }
          remove() {
            code=$(curl -s -o /tmp/delete.out -w '%{http_code}' -X DELETE "$API_URL/auth/v1/admin/users/$1" \
              -H "apikey: $SERVICE_ROLE_KEY" -H "Authorization: Bearer $SERVICE_ROLE_KEY")
            if [ "$code" != "200" ]; then
              echo "::error::Deleting $2 through GoTrue answered $code: $(cat /tmp/delete.out)"
              exit 1
            fi
          }
          holder=$(create holder@example.com)
          identity=$(create identity-replay@orangecat.invalid)
          psql "$DB" -v ON_ERROR_STOP=1 -c "
            INSERT INTO public.identity_links (identity_user_id, holder_user_id) VALUES ('$identity', '$holder');
            INSERT INTO public.identity_handovers (identity_user_id, offered_by, token_hash, expires_at)
              VALUES ('$identity', '$holder', repeat('a', 64), now() + interval '7 days');"
          remove "$identity" "an identity with an open hand-over offer"
          remove "$holder" "the account that held it"
          left=$(psql "$DB" -tAc "select (select count(*) from public.identity_links) + (select count(*) from public.identity_handovers)")
          if [ "$left" != "0" ]; then
            echo "::error::$left identity link or offer rows outlived both accounts"
            exit 1
          fi
          echo "A holder and its identity deleted through GoTrue; no link or offer left."

      - name: Tear down
        if: always()
        run: supabase stop --no-backup || true

  # Fast, independent gate: contract-phase (destructive) DDL in the migrations
  # changed by this PR must be intentional. Auto-rollback reverts code but not an
  # applied migration, so an unacknowledged DROP/RENAME breaks rollback safety.
  safety-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed migrations for contract-phase DDL
        run: |
          git fetch -q origin main || true
          changed=$(git diff --name-only origin/main...HEAD -- 'supabase/migrations/*.sql' || true)
          if [ -z "$changed" ]; then
            echo "No migration changes vs main — nothing to check."
            exit 0
          fi
          echo "Changed migrations:"; echo "$changed"
          # shellcheck disable=SC2086
          node scripts/db/check-migration-safety.mjs $changed
