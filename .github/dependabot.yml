version: 2
updates:
  # JavaScript/TypeScript dependencies (npm)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'deps'
    labels:
      - 'dependencies'
      - 'security'
    groups:
      # The fleet's own packages (chatkit, ai-kit, geo-kit…) arrive as ONE PR
      # when they release, so a fix made once reaches this app on its own.
      bitbaum:
        patterns:
          - '@bitbaum/*'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'ci'
    labels:
      - 'ci'
      - 'dependencies'
