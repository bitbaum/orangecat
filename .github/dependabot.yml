version: 2
updates:
  # JavaScript/TypeScript dependencies (npm)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'deps'
    labels:
      - 'dependencies'
      - 'security'
    groups:
      # The fleet's own packages (chatkit, ai-kit, geo-kit…) arrive as ONE PR
      # when they release, so a fix made once reaches this app on its own.
      bitbaum:
        patterns:
          - '@bitbaum/*'
      # React refuses to run when react and react-dom differ. Grouped only as
      # react + @types/react, #1176 moved react to 19.3.0 with react-dom still
      # on 19.2.8, and every component test failed to load. The four move as one.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'ci'
    labels:
      - 'ci'
      - 'dependencies'
